name: ci

on:
  push:
    branches: [main, "accountfree-libsql"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: lint
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: v2.13.2

  integration:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - name: verify the pinned libSQL image
        run: node scripts/libsql-fixture.mjs --check-pins
      - name: real libSQL server
        run: node scripts/libsql-fixture.mjs -- go test ./... -run TestIntegration -v -count=1
